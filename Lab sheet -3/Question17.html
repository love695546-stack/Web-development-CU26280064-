<!DOCTYPE html>
<html>
<head>
    <title>Vowel Counter</title>
</head>

<body>

    <h1>Vowel Counter</h1>

    <textarea id="paragraph" rows="6" cols="50"
        placeholder="Enter your paragraph here..."></textarea>

    <br><br>

    <button onclick="countVowels()">Count Vowels</button>

    <h3 id="result"></h3>

    <script>

        function countVowels() {

            // Get paragraph
            const text = document.getElementById("paragraph").value;

            // Vowels
            const vowels = "aeiou";

            // Counter
            let count = 0;

            // Check each character
            for (let char of text.toLowerCase()) {

                if (vowels.includes(char)) {
                    count++;
                }
            }

            // Display result
            document.getElementById("result").textContent =
                "Total vowels: " + count;
        }

    </script>

</body>
</html>
