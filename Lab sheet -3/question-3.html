<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8">
    <title>Student Grade Determination</title>
  </head>
  <body>
    <script>
      let marks = 75;
      let grade = "";
      if (marks >= 85) grade = "A";
      else if (marks >= 65) grade = "B";
      else if (marks >= 45) grade = "C";
      else grade = "D";
      console.log("Grade: " + grade);
      alert("Marks: " + marks + " | Grade: " + grade);
    </script>
  </body>
</html>
