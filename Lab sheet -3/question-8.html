<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8">
    <title>Interactive Calculator with Event Listeners</title>
  </head>
  <body>
    <button id="myBtn">Click Me</button>
    <script>
      let btn = document.getElementById("myBtn");
      btn.addEventListener("click", function() {
          alert("Button was clicked!");
      });
    </script>
  </body>
</html>
