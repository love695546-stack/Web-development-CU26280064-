<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <title>Arithmetic Operations via Prompt</title>
  </head>
  <body>
    <script>
      let num1 = Number(prompt("Enter first number:"));
      let num2 = Number(prompt("Enter second number:"));
      let sum = num1 + num2;
      let sub = num1 - num2;
      let mul = num1 * num2;
      let div = num1 / num2;
      alert(
        "Sum: " + sum + "\nSub: " + sub + "\nMul: " + mul + "\nDiv: " + div,
      );
    </script>
  </body>
</html>
