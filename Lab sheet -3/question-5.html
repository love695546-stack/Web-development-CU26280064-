<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8">
    <title>String Reversal and Palindrome Check</title>
  </head>
  <body>
    <script>
      let str = "madam";
      let rev = "";
      for (let i = str.length - 1; i >= 0; i--) {
          rev += str[i];
      }
      let msg = (str === rev) ? "It is a Palindrome" : "Not a Palindrome";
      alert(msg);
    </script>
  </body>
</html>
