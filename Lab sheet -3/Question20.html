<!DOCTYPE html>
<html>
<head>
    <title>Dynamic Table Generator</title>

    <style>
        body {
            font-family: Arial, sans-serif;
            text-align: center;
            margin-top: 50px;
        }

        input {
            padding: 10px;
            width: 100px;
            margin: 5px;
        }

        button {
            padding: 10px 20px;
            margin: 10px;
            cursor: pointer;
        }

        table {
            margin: 20px auto;
            border-collapse: collapse;
        }

        th, td {
            border: 1px solid black;
            padding: 12px 20px;
            text-align: center;
        }

        th {
            background-color: lightblue;
        }
    </style>
</head>

<body>

    <h1>Dynamic Table Generator</h1>

    <label>Rows:</label>
    <input type="number" id="rows" min="1" placeholder="Rows">

    <label>Columns:</label>
    <input type="number" id="columns" min="1" placeholder="Columns">

    <br>

    <button onclick="generateTable()">Generate Table</button>

    <div id="tableContainer"></div>

    <script>

        function generateTable() {

            // Get rows and columns
            const rows = document.getElementById("rows").value;
            const columns = document.getElementById("columns").value;

            // Check input
            if (rows <= 0 || columns <= 0) {
                alert("Please enter valid row and column numbers!");
                return;
            }

            // Create table
            const table = document.createElement("table");

            // Create rows and columns
            for (let i = 1; i <= rows; i++) {

                const tr = document.createElement("tr");

                for (let j = 1; j <= columns; j++) {

                    const td = document.createElement("td");

                    // Populate table
                    td.textContent = "Row " + i + ", Col " + j;

                    tr.appendChild(td);
                }

                table.appendChild(tr);
            }

            // Clear previous table
            const container = document.getElementById("tableContainer");
            container.innerHTML = "";

            // Display new table
            container.appendChild(table);
        }

    </script>

</body>
</html>
