<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8">
    <title>Dynamic DOM Element Creation</title>
  </head>
  <body>
    <script>
      let newPara = document.createElement("p");
      newPara.innerText = "Hello, this is newly created text!";
      document.body.appendChild(newPara);
    </script>
  </body>
</html>
