<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8">
    <title>Array Manipulation</title>
  </head>
  <body>
    <script>
      let fruits = ["Apple", "Banana"];
      fruits.push("Mango");
      fruits.pop();
      fruits.sort();
      console.log(fruits);
      alert("Array elements: " + fruits.join(", "));
    </script>
  </body>
</html>
