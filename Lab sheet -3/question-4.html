<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8">
    <title>Fibonacci Series Generator</title>
  </head>
  <body>
    <script>
      let n = 5;
      let a = 0, b = 1;
      let res = a + ", " + b;
      for (let i = 2; i < n; i++) {
          let next = a + b;
          res += ", " + next;
          a = b;
          b = next;
      }
      alert("Fibonacci: " + res);
    </script>
  </body>
</html>
