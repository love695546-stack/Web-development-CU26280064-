<body>
    <h3>How to Make Coffee</h3>
    <ol>
        <li>Boil a cup of water in a kettle.</li>
        <li>Add coffee powder and sugar to a mug.</li>
        <li>Pour the boiling water into the mug and stir well.</li>
        <li>Add milk according to your preference and serve hot.</li>
    </ol>
