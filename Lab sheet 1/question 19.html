<!DOCTYPE html>
<html>
<head>
    <title>Q19 - Rowspan Table</title>
</head>
<body>
    <table border="1">
        <tr>
            <th>Category</th>
            <th>Item</th>
        </tr>
        <tr>
            <td rowspan="2">Fruits</td>
            <td>Apple</td>
        </tr>
        <tr>
            <td>Banana</td>
        </tr>
    </table>
</body>
</html>
