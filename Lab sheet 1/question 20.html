<!DOCTYPE html>
<html>
<head>
    <title>Q20 - Semantic Table</title>
</head>
<body>
    <table border="1">
        <thead>
            <tr>
                <th>Month</th>
                <th>Revenue</th>
            </tr>
        </thead>
        <tbody>
            <tr>
                <td>January</td>
                <td>$5,000</td>
            </tr>
            <tr>
                <td>February</td>
                <td>$7,200</td>
            </tr>
        </tbody>
        <tfoot>
            <tr>
                <td>Total</td>
                <td>$12,200</td>
            </tr>
        </tfoot>
    </table>
</body>
</html>
