<!DOCTYPE html>
<!-- Question 16: Implement SEO meta tags (title, description, Open Graph tags) across all pages of the client website. -->
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    
    <!-- Primary SEO Meta Tags -->
    <title>Green Leaf Café | Organic Artisan Bakery & Coffee Shop</title>
    <meta name="title" content="Green Leaf Café | Organic Artisan Bakery & Coffee Shop">
    <meta name="description" content="Discover fair-trade organic coffee, sourdough bread, and vegan pastries at Green Leaf Café. Reserve your table online today!">
    <meta name="keywords" content="organic cafe, artisan bakery, sourdough, eco-friendly coffee, table reservation">
    <meta name="robots" content="index, follow">

    <!-- Open Graph / Facebook Meta Tags -->
    <meta property="og:type" content="website">
    <meta property="og:url" content="https://www.greenleafcafe.com/">
    <meta property="og:title" content="Green Leaf Café | Organic Artisan Bakery">
    <meta property="og:description" content="Fresh artisan sourdough and organic coffee. Book your table online.">
    <meta property="og:image" content="https://www.greenleafcafe.com/assets/og_banner.jpg">

    <!-- Twitter Meta Tags -->
    <meta property="twitter:card" content="summary_large_image">
    <meta property="twitter:title" content="Green Leaf Café | Organic Bakery">
    <meta property="twitter:description" content="Fresh organic bakery items & table booking.">
</head>
<body>
    <h1>Welcome to Green Leaf Café</h1>
</body>
</html>
