# Q18 & Q19: Apache Virtual Host Configuration with SSL/TLS

# 1. Generate local SSL Certificate:
# openssl req -x509 -nodes -days 365 -newkey rsa:2048 -keyout myproject.key -out myproject.crt

# 2. Virtual Host Config (httpd-vhosts.conf):
<VirtualHost *:443>
    ServerName myproject.local
    DocumentRoot "C:/xampp/htdocs/mca108p-lab10/public"

    SSLEngine on
    SSLCertificateFile "C:/xampp/apache/conf/ssl.crt/myproject.crt"
    SSLCertificateKeyFile "C:/xampp/apache/conf/ssl.key/myproject.key"

    <Directory "C:/xampp/htdocs/mca108p-lab10/public">
        AllowOverride All
        Require all granted
    </Directory>
</VirtualHost>

# 3. Map host in OS hosts file (C:\Windows\System32\drivers\etc\hosts):
# 127.0.0.1 myproject.local
