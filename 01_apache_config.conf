# ===================================================================
# Q1: Configure Apache to run Python CGI scripts or WSGI applications
# ===================================================================

# ---------- OPTION A: CGI on Linux (Ubuntu / Debian) ----------
#   sudo apt install apache2
#   sudo a2enmod cgi            # enable the CGI module
#   sudo cp 01_hello_cgi.py /usr/lib/cgi-bin/ && sudo chmod +x /usr/lib/cgi-bin/01_hello_cgi.py
#   sudo systemctl restart apache2
#   Test: http://localhost/cgi-bin/01_hello_cgi.py
#
# In /etc/apache2/conf-available/serve-cgi-bin.conf (already present by default):
ScriptAlias /cgi-bin/ /usr/lib/cgi-bin/
<Directory "/usr/lib/cgi-bin">
    AllowOverride None
    Options +ExecCGI
    AddHandler cgi-script .py
    Require all granted
</Directory>

# ---------- OPTION B: CGI on Windows with XAMPP ----------
#   1. Edit the first line of 01_hello_cgi.py to your Python path, e.g.
#        #!C:/Python312/python.exe
#   2. Copy the script into C:\xampp\cgi-bin\
#   3. In C:\xampp\apache\conf\httpd.conf make sure these lines exist:
#        LoadModule cgi_module modules/mod_cgi.so
#        ScriptAlias /cgi-bin/ "C:/xampp/cgi-bin/"
#        <Directory "C:/xampp/cgi-bin">
#            AllowOverride None
#            Options +ExecCGI
#            AddHandler cgi-script .py
#            Require all granted
#        </Directory>
#   4. Restart Apache from the XAMPP control panel.
#   Test: http://localhost/cgi-bin/01_hello_cgi.py

# ---------- OPTION C: WSGI with mod_wsgi (Linux) ----------
#   sudo apt install libapache2-mod-wsgi-py3
#   sudo a2enmod wsgi
#   Copy 01_hello_wsgi.py to /var/www/pyapp/ and add to a virtual host:
WSGIScriptAlias /hello /var/www/pyapp/01_hello_wsgi.py
<Directory /var/www/pyapp>
    Require all granted
</Directory>
#   sudo systemctl restart apache2
#   Test: http://localhost/hello
