<!DOCTYPE html>
<html>
<head>
<title>Student Management System</title>
<style>
body{
    margin:0;
    background:#ddd;
    font-family:Arial;
}
.page{
    width:90%;
    height:500px;
    margin:40px auto;
    background:white;
    border:3px solid #333;
}
.header{
    height:80px;
    background:#4f46e5;
    color:white;
    text-align:center;
    padding-top:1px;
}
.main{
    display:flex;
    height:416px;
}
.nav{
    width:180px;
    background:#eee;
    padding:15px;
    box-sizing:border-box;
}
.nav h3{color:#333}
.nav a{
    display:block;
    padding:10px;
    margin:5px 0;
    color:#333;
    text-decoration:none;
    border-radius:5px;
}
.nav a:hover{
    background:#4f46e5;
    color:white;
}
.content{
    flex:1;
    padding:25px;
}
</style>
</head>

<body>

<div class="page">

    <div class="header">
        <h1>Student Management System</h1>
    </div>

    <div class="main">

        <div class="nav">
            <h3>Navigation</h3>
            <a href="#">Home</a>
            <a href="#">Students</a>
            <a href="#">Courses</a>
            <a href="#">Contact</a>
        </div>

        <div class="content">
            <h2>Welcome</h2>
            <p>This is the content frame.</p>
            <p>Select an option from the navigation menu.</p>
        </div>

    </div>

</div>

</body>
</html>
