<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login Interface</title>
    <style>
        /* Global Reset & Background Styling */
        body {
            margin: 0;
            height: 100vh;
            background: linear-gradient(135deg, #3498db, #8e44ad);
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            position: relative; /* Context for absolute child */
        }

        /* Centered Card Container using Absolute Positioning */
        .login-card {
            position: absolute; /* Absolute positioning required */
            top: 50%;           /* Move down 50% of the screen */
            left: 50%;          /* Move right 50% of the screen */
            transform: translate(-50%, -50%); /* Perfect centering offset */
            
            background: #ffffff;
            padding: 35px 30px;
            width: 100%;
            max-width: 360px;
            
            /* Required Styling Properties */
            border-radius: 12px;                  /* Rounded corners */
            box-shadow: 0 15px 35px rgba(0, 0, 0, 0.2); /* Depth effect */
            
            box-sizing: border-box;
        }

        .login-card h2 {
            margin-top: 0;
            margin-bottom: 25px;
            color: #2c3e50;
            text-align: center;
            font-size: 24px;
        }

        /* Form Layout Elements */
        .input-group {
            margin-bottom: 18px;
        }

        .input-group label {
            display: block;
            margin-bottom: 6px;
            font-size: 13px;
            font-weight: 600;
            color: #555;
        }

        .input-group input {
            width: 100%;
            padding: 10px 12px;
            border: 1px solid #ccc;
            border-radius: 6px; /* Smooth input rounding */
            font-size: 14px;
            box-sizing: border-box;
            transition: border-color 0.3s;
        }

        .input-group input:focus {
            border-color: #3498db;
            outline: none;
            box-shadow: 0 0 5px rgba(52, 152, 219, 0.3);
        }

        /* Submit Button */
        .login-btn {
            width: 100%;
            padding: 11px;
            background-color: #3498db;
            color: white;
            border: none;
            border-radius: 6px;
            font-size: 15px;
            font-weight: bold;
            cursor: pointer;
            transition: background-color 0.3s, transform 0.1s;
            margin-top: 10px;
        }

        .login-btn:hover {
            background-color: #2980b9;
        }

        .login-btn:active {
            transform: scale(0.98);
        }
    </style>
</head>
<body>

    <!-- Centered Login Card -->
    <div class="login-card">
        <h2>Welcome Back</h2>
        <form action="#" method="POST">
            
            <div class="input-group">
                <label for="email">Email Address</label>
                <input type="email" id="email" name="email" placeholder="user@example.com" required>
            </div>

            <div class="input-group">
                <label for="password">Password</label>
                <input type="password" id="password" name="password" placeholder="••••••••" required>
            </div>

            <button type="submit" class="login-btn">Log In</button>

        </form>
    </div>

</body>
</html>
