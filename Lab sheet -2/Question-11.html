<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <title>Contact Form</title>

    <!-- External CSS -->
    <link rel="stylesheet" href="Question-11.css">

    <!-- Internal CSS -->
    <style>
        .contact-form {
            width: 400px;
            margin: 50px auto;
            padding: 20px;
            background-color: white;
        }

        input {
            border: 2px solid green;
        }

        button {
            background-color: green;
        }
    </style>
</head>

<body>

    <div class="contact-form">

        <h2>Contact Us</h2>

        <form>

            <label>Name:</label><br>
            <input type="text" placeholder="Enter your name"><br><br>

            <label>Email:</label><br>
            <input type="email" placeholder="Enter your email"><br><br>

            <label>Message:</label><br>
            <textarea rows="4" placeholder="Enter your message"></textarea><br><br>

            <!-- Inline CSS -->
            <button type="submit"
                style="background-color: red; cursor: pointer;">
                Send Message
            </button>

        </form>

    </div>

</body>

</html>
