<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Employee Evaluation Form</title>

    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #f2f2f2;
        }

        .form-container {
            width: 700px;
            margin: 30px auto;
            padding: 25px;
            background-color: white;
            border: 1px solid #ccc;
            border-radius: 8px;
        }

        h2 {
            text-align: center;
            margin-bottom: 25px;
        }

        .form-group {
            margin-bottom: 20px;
        }

        .form-group label {
            width: 180px;
            float: left;
            font-weight: bold;
        }

        .form-group input,
        .form-group select,
        .form-group textarea {
            width: 450px;
            padding: 8px;
            border: 1px solid #aaa;
            border-radius: 4px;
        }

        /* Clear the floated elements */
        .clear {
            clear: both;
        }

        textarea {
            height: 80px;
        }

        .rating {
            float: left;
            margin-right: 20px;
        }

        .submit-section {
            clear: both;
            text-align: center;
            margin-top: 25px;
        }

        .submit-btn {
            padding: 10px 25px;
            background-color: #007bff;
            color: white;
            border: none;
            border-radius: 5px;
            cursor: pointer;
        }

        .submit-btn:hover {
            background-color: #0056b3;
        }
    </style>
</head>

<body>

    <div class="form-container">

        <h2>Employee Evaluation Form</h2>

        <form>

            <div class="form-group">
                <label>Employee Name:</label>
                <input type="text" name="employee_name">
                <div class="clear"></div>
            </div>

            <div class="form-group">
                <label>Employee ID:</label>
                <input type="text" name="employee_id">
                <div class="clear"></div>
            </div>

            <div class="form-group">
                <label>Department:</label>
                <select name="department">
                    <option>Select Department</option>
                    <option>HR</option>
                    <option>IT</option>
                    <option>Finance</option>
                    <option>Marketing</option>
                </select>
                <div class="clear"></div>
            </div>

            <div class="form-group">
                <label>Performance Rating:</label>

                <div class="rating">
                    <input type="radio" name="rating" value="Excellent">
                    Excellent
                </div>

                <div class="rating">
                    <input type="radio" name="rating" value="Good">
                    Good
                </div>

                <div class="rating">
                    <input type="radio" name="rating" value="Average">
                    Average
                </div>

                <div class="clear"></div>
            </div>

            <div class="form-group">
                <label>Comments:</label>
                <textarea name="comments"></textarea>
                <div class="clear"></div>
            </div>

            <div class="submit-section">
                <button type="submit" class="submit-btn">
                    Submit Evaluation
                </button>
            </div>

        </form>
    </div>

</body>
</html>
