<!DOCTYPE html>
<html lang="en">
<head>

    <title>Styled Registration Form</title>
    <!-- Link to External CSS -->
    <link rel="stylesheet" href="Question-1.css">
</head>
<body>

    <div class="form-container">
        <h2>Create an Account</h2>
        <form action="#" method="POST">
            
            <!-- Text Input -->
            <div class="form-group">
                <label for="fullname">Full Name</label>
                <input type="text" id="fullname" name="fullname" placeholder="Enter your full name" required>
            </div>

            <!-- Password Input -->
            <div class="form-group">
                <label for="password">Password</label>
                <input type="password" id="password" name="password" placeholder="Enter your password" required>
            </div>

            <!-- Radio Buttons -->
            <div class="form-group">
                <label>Gender</label>
                <div class="radio-group">
                    <label class="radio-label">
                        <input type="radio" name="gender" value="male"> Male
                    </label>
                    <label class="radio-label">
                        <input type="radio" name="gender" value="female"> Female
                    </label>
                    <label class="radio-label">
                        <input type="radio" name="gender" value="other"> Other
                    </label>
                </div>
            </div>

            <!-- Dropdown Select -->
            <div class="form-group">
                <label for="country">Country</label>
                <select id="country" name="country">
                    <option value="" disabled selected>Select your country</option>
                    <option value="usa">United States</option>
                    <option value="uk">United Kingdom</option>
                    <option value="india">India</option>
                    <option value="canada">Canada</option>
                </select>
            </div>

            <!-- Checkboxes -->
            <div class="form-group">
                <label>Interests</label>
                <div class="checkbox-group">
                    <label class="checkbox-label">
                        <input type="checkbox" name="interest" value="coding"> Coding
                    </label>
                    <label class="checkbox-label">
                        <input type="checkbox" name="interest" value="design"> Design
                    </label>
                    <label class="checkbox-label">
                        <input type="checkbox" name="interest" value="gaming"> Gaming
                    </label>
                </div>
            </div>

            <!-- Textarea -->
            <div class="form-group">
                <label for="bio">Short Bio</label>
                <textarea id="bio" name="bio" rows="4" placeholder="Tell us a little bit about yourself..."></textarea>
            </div>

            <!-- Submit Button -->
            <button type="submit" class="submit-btn">Submit</button>

        </form>
    </div>

</body>
</html>
