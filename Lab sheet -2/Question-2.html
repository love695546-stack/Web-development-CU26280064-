<!DOCTYPE html>
<html lang="en">
<head>
<title>Student Registration</title>
<style>
*{box-sizing:border-box}
body{
    margin:0; min-height:100vh; display:flex; justify-content:center;
    align-items:center; font-family:Arial,sans-serif;
    background:linear-gradient(135deg,#667eea,#764ba2);
}
.form-container{
    width:100%; max-width:390px; background:#fff; padding:20px;
    border-radius:12px; box-shadow:0 10px 25px #0004;
    margin:20px;
}
h2{text-align:center;color:#4a0e4e;margin:0 0 14px;font-size:21px}
.form-group{margin-bottom:8px}
label{display:block;font-size:12px;font-weight:bold;color:#444;margin-bottom:3px}
input,select,textarea{
    width:100%; padding:7px 9px; border:1px solid #ccc;
    border-radius:6px; font-size:12px; background:#fafafa;
}
input:focus,select:focus,textarea:focus{
    outline:none;border-color:#7c3aed;
    box-shadow:0 0 5px #7c3aed33;background:#fff;
}
.hint{font-size:9px;color:#888}
.radio-group,.checkbox-group{display:flex;gap:18px}
.radio-group label,.checkbox-group label{
    display:flex;align-items:center;gap:4px;font-weight:normal;
}
.radio-group input,.checkbox-group input{width:auto}
textarea{height:42px;resize:none}
.submit-btn{
    width:100%;padding:8px;border:0;border-radius:6px;color:white;
    font-size:13px;font-weight:bold;cursor:pointer;
    background:linear-gradient(135deg,#7c3aed,#4f46e5);
}
.submit-btn:hover{opacity:.9;transform:translateY(-1px)}
</style>
</head>
<body>
<div class="form-container">
<h2>Student Registration</h2>
<form action="#" method="POST">
<div class="form-group"><label>Full Name</label>
<input type="text" name="fullname" required minlength="3" maxlength="50"></div>
<div class="form-group"><label>Email</label>
<input type="email" name="email" required></div>
<div class="form-group"><label>Student ID</label>
<input type="text" name="studentid" pattern="[A-Z]{2}[0-9]{5}" required>
<small class="hint">Example: ST12345</small></div>
<div class="form-group"><label>Phone</label>
<input type="tel" name="phone" pattern="[0-9]{10}" required></div>
<div class="form-group"><label>Password</label>
<input type="password" name="password" minlength="8" required></div>
<div class="form-group"><label>DOB</label>
<input type="date" name="dob" required></div>
<div class="form-group"><label>Gender</label>
<div class="radio-group"><label><input type="radio" name="gender" value="Male" required> Male</label>
<label><input type="radio" name="gender" value="Female"> Female</label></div></div>
<div class="form-group"><label>Course</label>
<select name="course" required><option value="">Select Course</option>
<option>Computer Science</option><option>Engineering</option></select></div>
<div class="form-group"><label>Activities</label>
<div class="checkbox-group"><label><input type="checkbox" name="activity" value="Sports"> Sports</label>
<label><input type="checkbox" name="activity" value="Music"> Music</label></div></div>
<div class="form-group"><label>Address</label>
<textarea name="address" required></textarea></div>
<button class="submit-btn" type="submit">Register</button>
</form>
</div>
</body>
</html>
