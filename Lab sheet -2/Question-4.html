<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Student Management System</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background: #f1f5f9;
        }

        .container {
            width: 90%;
            height: 90vh;
            margin: 5vh auto;
            background: white;
            border-radius: 12px;
            overflow: hidden;
            box-shadow: 0 8px 25px #0003;
        }

        .header {
            height: 80px;
            background: #4f46e5;
            color: white;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        .header h1 {
            margin: 0;
            font-size: 25px;
        }

        .main {
            display: flex;
            height: calc(100% - 80px);
        }

        .navigation {
            width: 200px;
            background: #e5e7eb;
            padding: 20px;
        }

        .navigation h3 {
            margin-top: 0;
            text-align: center;
        }

        .navigation a {
            display: block;
            padding: 12px;
            margin: 8px 0;
            color: #333;
            text-decoration: none;
            border-radius: 6px;
        }

        .navigation a:hover {
            background: #4f46e5;
            color: white;
        }

        .content {
            flex: 1;
            padding: 30px;
            background: #fff;
        }

        .content h2 {
            color: #4f46e5;
        }

        @media (max-width: 600px) {
            .container {
                width: 95%;
            }

            .navigation {
                width: 140px;
                padding: 10px;
            }
        }
    </style>
</head>

<body>

<div class="container">

    <!-- Header -->
    <header class="header">
        <h1>Student Management System</h1>
    </header>

    <!-- Main Flexbox Area -->
    <div class="main">

        <!-- Navigation -->
        <nav class="navigation">
            <h3>Navigation</h3>
            <a href="#">Home</a>
            <a href="#">Students</a>
            <a href="#">Courses</a>
            <a href="#">Contact</a>
        </nav>

        <!-- Content -->
        <main class="content">
            <h2>Welcome</h2>
            <p>This is the content area.</p>
            <p>
                The webpage uses CSS Flexbox to create
                a modern frame-like layout.
            </p>
        </main>

    </div>

</div>

</body>
</html>
