<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Newsletter Subscription</title>

    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #f2f2f2;
        }

        .newsletter {
            width: 400px;
            margin: 100px auto;
            padding: 30px;
            background-color: white;
            text-align: center;
            border-radius: 10px;
            box-shadow: 0 0 10px #ccc;
        }

        .newsletter h2 {
            margin-bottom: 10px;
        }

        .newsletter p {
            color: #666;
        }

        /* Input container */
        .input-box {
            position: relative;
            margin-top: 30px;
        }

        .input-box input {
            width: 100%;
            padding: 12px;
            box-sizing: border-box;
            border: 2px solid #aaa;
            border-radius: 5px;
            font-size: 16px;
            outline: none;
        }

        /* Floating label */
        .input-box label {
            position: absolute;
            left: 12px;
            top: 13px;
            color: #777;
            background-color: white;
            padding: 0 5px;
            transition: 0.3s;
        }

        /* Move label when input is focused */
        .input-box input:focus + label,
        .input-box input:not(:placeholder-shown) + label {
            top: -10px;
            font-size: 13px;
            color: #007bff;
        }

        .input-box input:focus {
            border-color: #007bff;
        }

        button {
            width: 100%;
            margin-top: 20px;
            padding: 12px;
            background-color: #007bff;
            color: white;
            border: none;
            border-radius: 5px;
            cursor: pointer;
        }

        button:hover {
            background-color: #0056b3;
        }
    </style>
</head>

<body>

    <div class="newsletter">

        <h2>Subscribe to Our Newsletter</h2>

        <p>Get the latest updates directly in your inbox.</p>

        <form>

            <div class="input-box">
                <input type="email"
                       id="email"
                       placeholder=" "
                       required>

                <label for="email">Email Address</label>
            </div>

            <button type="submit">Subscribe</button>

        </form>

    </div>

</body>
</html>
